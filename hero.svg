<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 680" role="img" aria-labelledby="title desc">
  <title id="title">Object-268 archive card</title>
  <desc id="desc">An abstract cream card with court lines, a blue record, layered paper notes and the number 268.</desc>

  <rect width="900" height="680" rx="26" fill="#f3eee5"/>
  <rect x="26" y="26" width="848" height="628" rx="20" fill="#fffaf2" stroke="#d8d0c4" stroke-width="2"/>

  <!-- court geometry -->
  <g fill="none" stroke="#c2410c" stroke-width="2" opacity="0.42">
    <rect x="78" y="78" width="744" height="524" rx="4"/>
    <path d="M78 340h744"/>
    <path d="M266 78v524M634 78v524"/>
    <path d="M266 210h368M266 470h368"/>
    <path d="M78 210h188M634 210h188M78 470h188M634 470h188"/>
  </g>

  <!-- blue record -->
  <g transform="translate(660 170)">
    <circle r="92" fill="#0369a1" opacity="0.12"/>
    <circle r="64" fill="#0369a1" opacity="0.18"/>
    <circle r="36" fill="#0369a1" opacity="0.26"/>
    <circle r="7" fill="#0369a1"/>
    <path d="M-64 0a64 64 0 0 1 64-64" fill="none" stroke="#0369a1" stroke-width="3" opacity="0.6"/>
  </g>

  <!-- shuttle -->
  <g transform="translate(690 472) rotate(-18)">
    <path d="M0 0l-30-58M0 0l30-58M0 0l-11-62M0 0l11-62" stroke="#c2410c" stroke-width="2.5" fill="none"/>
    <path d="M-30-58Q0-74 30-58" stroke="#c2410c" stroke-width="2.5" fill="none"/>
    <circle r="10" fill="#c2410c"/>
  </g>

  <!-- layered paper cards -->
  <g transform="translate(575 470) rotate(5)">
    <rect x="0" y="0" width="170" height="108" rx="8" fill="#e9dfd1" stroke="#cfc4b4"/>
    <rect x="12" y="-14" width="170" height="108" rx="8" fill="#fffdf8" stroke="#d8d0c4"/>
    <path d="M30 5h88M30 23h130M30 41h104M30 59h72" stroke="#bfb6a6" stroke-width="4" stroke-linecap="round"/>
    <circle cx="146" cy="79" r="9" fill="#c2410c" opacity="0.7"/>
  </g>

  <!-- number -->
  <text x="82" y="468" font-family="Georgia, 'Times New Roman', serif" font-size="208" font-weight="700" letter-spacing="-12" fill="#1f2937">268</text>
  <text x="92" y="516" font-family="Consolas, monospace" font-size="14" font-weight="700" letter-spacing="6" fill="#c2410c">OBJECT / ARCHIVE</text>

  <!-- small labels -->
  <g font-family="Consolas, monospace" font-size="11" fill="#6b7280" letter-spacing="2">
    <text x="92" y="112">MUSIC · COURT · SERVER · ANIME</text>
    <text x="92" y="574">ONE PAGE AT A TIME</text>
  </g>

  <!-- corner ticks -->
  <g stroke="#1f2937" stroke-width="2" opacity="0.5">
    <path d="M78 112V78h34M822 78h-34M78 568v34h34M822 602h-34"/>
  </g>
</svg>
